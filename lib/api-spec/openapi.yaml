openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rides
    description: Ride dispatch and lifecycle operations
  - name: admin
    description: Admin operations for driver application management
  - name: ride-along
    description: Ride-Along Driver onboarding and profile management
  - name: stripe
    description: Stripe Connect onboarding and account status
  - name: tandem
    description: Tandem job management (Mode A/B/C partner coordination)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rides/dispatch:
    post:
      operationId: dispatchRide
      tags: [rides]
      summary: Dispatch a new ride to eligible drivers
      description: |
        Creates a ride record and inserts driver_assignments rows for each
        required driver. Inserting into driver_assignments triggers Supabase
        Realtime postgres_changes events, delivering the request to online
        drivers in real time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRideRequest"
      responses:
        "201":
          description: Ride dispatched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchRideResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No eligible drivers found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/assignments/{assignmentId}/accept:
    post:
      operationId: acceptRideAssignment
      tags: [rides]
      summary: Accept a pending ride assignment
      description: |
        Atomically checks that the assignment is still pending and within the
        response deadline, then updates its status to 'accepted'. Returns an
        error if the deadline has passed or another driver already accepted.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentActionResponse"
        "400":
          description: Deadline passed or assignment no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/assignments/{assignmentId}/decline:
    post:
      operationId: declineRideAssignment
      tags: [rides]
      summary: Decline a pending ride assignment
      description: |
        Marks the assignment as 'rejected'. The dispatch system can then
        offer the ride to the next available driver.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentActionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/assignments/{assignmentId}/stage:
    patch:
      operationId: updateAssignmentStage
      tags: [rides]
      summary: Update the active stage of a ride assignment
      description: |
        Records stage transitions (en_route → arrived → in_progress) for an
        active assignment. Used by the driver during a live ride.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStageRequest"
      responses:
        "200":
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentActionResponse"
        "400":
          description: Invalid stage transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/{rideId}/complete:
    post:
      operationId: completeRide
      tags: [rides]
      summary: Complete a ride and trigger payout calculation
      description: |
        Marks the ride as completed, recalculates fare based on actual distance,
        updates the driver assignment, and creates a payout record. Requires
        the assignment to be in 'in_progress' status.
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRideRequest"
      responses:
        "200":
          description: Ride completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideCompletionResult"
        "400":
          description: Ride not in completable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ride or assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ride-along-drivers:
    post:
      operationId: createRideAlongDriver
      tags: [ride-along]
      summary: Create a Ride-Along Driver application
      description: |
        Creates a new Ride-Along Driver profile for the authenticated user.
        Returns 409 if the user already has a profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRideAlongDriverRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideAlongDriverRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Profile already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/connect/onboard:
    post:
      operationId: stripeConnectOnboard
      tags: [stripe]
      summary: Create or retrieve a Stripe Connect onboarding link
      description: |
        Creates a Stripe Express account for the authenticated driver (if one
        doesn't already exist) and returns a one-time account link URL.
        The client opens this URL so the driver can complete identity
        verification and add their bank account or debit card.
      responses:
        "200":
          description: Onboarding link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeAccountLink"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ride-along-drivers/me:
    get:
      operationId: getRideAlongDriverMe
      tags: [ride-along]
      summary: Get the authenticated user's Ride-Along Driver profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideAlongDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No profile found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/connect/status:
    get:
      operationId: stripeConnectStatus
      tags: [stripe]
      summary: Get the Stripe Connect account status for the authenticated driver
      description: |
        Returns whether the driver's Stripe Express account onboarding is
        complete and whether payouts / instant transfers are enabled.
      responses:
        "200":
          description: Account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeAccountStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/connect/refresh:
    post:
      operationId: stripeConnectRefresh
      tags: [stripe]
      summary: Refresh an expired Stripe Connect onboarding link
      description: |
        Generates a fresh account link when the previous one has expired.
        Called when Stripe redirects the driver back to the refresh_url.
      responses:
        "200":
          description: Refreshed onboarding link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeAccountLink"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No Stripe account found — start onboarding first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ride-along-drivers/{id}:
    patch:
      operationId: updateRideAlongDriver
      tags: [ride-along]
      summary: Update a Ride-Along Driver profile
      description: Used by the driver to update documents or resubmit after rejection.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRideAlongDriverRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideAlongDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not your profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ride-along-drivers:
    get:
      operationId: listAdminRideAlongDrivers
      tags: [admin]
      summary: List Ride-Along Driver applications for admin review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: pending_approval
          description: Filter by status
      responses:
        "200":
          description: List of Ride-Along Driver records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRideAlongDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ride-along-drivers/{id}/approve:
    patch:
      operationId: approveRideAlongDriver
      tags: [admin]
      summary: Approve a Ride-Along Driver application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ride-along-drivers/{id}/reject:
    patch:
      operationId: rejectRideAlongDriver
      tags: [admin]
      summary: Reject a Ride-Along Driver application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers:
    get:
      operationId: listAdminDrivers
      tags: [admin]
      summary: List drivers filtered by status
      description: |
        Returns driver application records for admin review.
        Requires admin authentication (Bearer token + ADMIN_EMAILS check).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: pending_approval
          description: Filter by driver status
        - name: reviewerEmail
          in: query
          required: false
          schema:
            type: string
          description: |
            If provided, only return drivers whose most recent audit log entry
            was written by this admin email (case-insensitive).
      responses:
        "200":
          description: Driver list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers/{driverId}/audit-log:
    get:
      operationId: getDriverAuditLog
      tags: [admin]
      summary: Get the full activity history for a driver
      description: |
        Returns all admin actions taken against this driver, newest first.
        Each entry includes the admin's email, the action, the resulting
        status (if any), and an optional reason.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverAuditLogEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reviewers:
    get:
      operationId: listAdminReviewers
      tags: [admin]
      summary: List admin emails that have reviewed at least one driver
      description: |
        Returns the distinct set of admin emails that appear in the driver
        audit log. Used to populate the "Filter by reviewer" dropdown on
        the driver list page.
      responses:
        "200":
          description: Reviewer list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers/{driverId}/approve:
    post:
      operationId: approveDriver
      tags: [admin]
      summary: Approve a driver application
      description: Sets the driver's status to active.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Driver approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers/{driverId}/reject:
    post:
      operationId: rejectDriver
      tags: [admin]
      summary: Reject a driver application
      description: |
        Sets the driver's status to inactive and emails the driver with the
        provided reason explaining why their application was rejected.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDriverRequest"
      responses:
        "200":
          description: Driver rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers/{driverId}/reject-documents:
    post:
      operationId: rejectDriverDocuments
      tags: [admin]
      summary: Request document resubmission from a driver
      description: |
        Flags the driver's documents as rejected and records a reason.
        The driver's status remains pending_approval so they can re-upload.
        The driver sees a prominent rejection notice on their pending screen.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDocumentsRequest"
      responses:
        "200":
          description: Documents flagged for resubmission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers/{driverId}/clear-document-rejection:
    post:
      operationId: clearDriverDocumentRejection
      tags: [admin]
      summary: Clear a document rejection flag
      description: Removes the rejection reason from a driver record (e.g. after manually verifying re-uploaded documents).
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejection flag cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /drivers/me/services:
    patch:
      operationId: updateDriverServices
      tags: [rides]
      summary: Update the driver's service type capabilities
      description: Allows a driver to opt in or out of rideshare and delivery service types.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDriverServicesRequest"
      responses:
        "200":
          description: Services updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDriverServicesResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /device-tokens:
    post:
      operationId: registerDeviceToken
      tags: [rides]
      summary: Register or refresh a push notification token for the authenticated driver
      description: |
        Stores a Web Push subscription (or FCM/APNs token) so the API server can
        deliver real native push notifications to this device even when the app
        is closed. The Supabase user is resolved to either a `driver` or
        `ride_along_driver` record and the token is associated with that owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceTokenRequest"
      responses:
        "200":
          description: Token refreshed (already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceTokenResult"
        "201":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceTokenResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: revokeDeviceToken
      tags: [rides]
      summary: Revoke a previously registered push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeDeviceTokenRequest"
      responses:
        "204":
          description: Token revoked
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /device-tokens/vapid-key:
    get:
      operationId: getVapidPublicKey
      tags: [rides]
      summary: Get the server's VAPID public key for Web Push subscription
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey:
                    type: string
        "503":
          description: Push notifications not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rides:
    get:
      operationId: listAdminRides
      tags: [admin]
      summary: List rides filtered by status
      description: Returns ride records for admin review. Requires admin authentication.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: "Filter by ride status. If omitted, returns all non-terminal rides."
      responses:
        "200":
          description: Ride list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRideRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rides/{rideId}/cancel:
    post:
      operationId: adminCancelRide
      tags: [admin]
      summary: Cancel a ride (admin)
      description: |
        Cancels a ride in any non-terminal status and notifies the connected
        driver via Supabase Realtime. Protected by admin authentication.
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCancelRideRequest"
      responses:
        "200":
          description: Ride cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCancelRideResult"
        "400":
          description: Ride is already in a terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ride not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs:
    post:
      operationId: createTandemJob
      tags: [tandem]
      summary: Create a tandem job for a ride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTandemJobRequest"
      responses:
        "201":
          description: Tandem job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tandem job already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/lookup-partner:
    get:
      operationId: lookupTandemPartner
      tags: [tandem]
      summary: Validate a potential known partner by email, ride-along driver ID, or MCC user ID
      parameters:
        - in: query
          name: email
          required: false
          schema:
            type: string
          description: Partner email address (mutually exclusive with id)
        - in: query
          name: id
          required: false
          schema:
            type: string
            format: uuid
          description: Ride-along driver UUID or Supabase user UUID (mutually exclusive with email)
      responses:
        "200":
          description: Partner lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerLookupResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}:
    get:
      operationId: getTandemJob
      tags: [tandem]
      summary: Get a tandem job by ID
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tandem job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/mode:
    patch:
      operationId: updateTandemJobMode
      tags: [tandem]
      summary: Update the tandem mode for a job
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTandemModeRequest"
      responses:
        "200":
          description: Updated tandem job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/broadcast:
    post:
      operationId: broadcastTandemJob
      tags: [tandem]
      summary: Open the Mode B match broadcast window for a tandem job
      description: |
        Marks the tandem job as `broadcast`, sets a `match_deadline` 2 hours in
        the future, and returns the current list of eligible ride-along drivers.
        Only valid for Mode B tandem jobs. The background expiry worker will
        flip overdue broadcasts to `expired`.
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Broadcast opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemBroadcastResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tandem job already matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Tandem job is not in Mode B
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/eligible-drivers:
    get:
      operationId: getTandemJobEligibleDrivers
      tags: [tandem]
      summary: List eligible ride-along drivers for a Mode B tandem job
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Eligible drivers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemEligibleDriversResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/ridealong-accept:
    post:
      operationId: acceptTandemMatch
      tags: [tandem]
      summary: Accept a Mode B tandem job as a ride-along driver
      description: |
        Atomically claims the broadcast match. Only the first caller wins —
        subsequent callers receive 409 with "Job already taken".
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Match accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — partner not verified or active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Tandem job is not in Mode B
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/ridealong-decline:
    post:
      operationId: declineTandemMatch
      tags: [tandem]
      summary: Decline a Mode B tandem job as a ride-along driver
      description: |
        Records the decline so the driver is excluded from re-broadcasts of the
        same tandem job. Idempotent.
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineTandemMatchRequest"
      responses:
        "200":
          description: Decline recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOkResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/provider-accept:
    patch:
      operationId: providerAcceptTandemMatch
      tags: [tandem]
      summary: Provider confirms the matched ride-along driver
      description: |
        Provider explicitly accepts the matched ride-along driver and forwards
        the approval request to the member. Atomically transitions the job
        from `matched` to `member_pending`. Idempotent: returns the existing
        record if the job has already advanced.
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Provider acceptance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the tandem job's provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tandem job is no longer in matched state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Provider-accept only valid for Mode B tandem jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/member-approve:
    patch:
      operationId: memberApproveTandemMatch
      tags: [tandem]
      summary: Member approves the matched ride-along driver
      description: |
        Marks the tandem job as `confirmed` and stamps `memberApproved=true`.
        Idempotent: returns the existing record if the job is already confirmed.
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tandem job is not awaiting member approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/member-decline:
    patch:
      operationId: memberDeclineTandemMatch
      tags: [tandem]
      summary: Member declines the matched ride-along driver
      description: |
        Records the previously matched driver as a decline (so they are
        excluded from re-matching) and re-broadcasts the job to the remaining
        eligible drivers.
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineTandemMatchRequest"
      responses:
        "200":
          description: Job re-broadcast to remaining eligible drivers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemBroadcastResult"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tandem job is not awaiting member approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Re-broadcast only valid for Mode B tandem jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/request-rematch:
    patch:
      operationId: requestTandemRematch
      tags: [tandem]
      summary: Provider requests a different ride-along driver match
      description: |
        Records the currently matched driver as a decline and re-broadcasts the
        job so the provider can receive a different match. Only the owning
        provider may call this.
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineTandemMatchRequest"
      responses:
        "200":
          description: Job re-broadcast to remaining eligible drivers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemBroadcastResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not your tandem job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tandem job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tandem job is not in a rematchable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Rematch only valid for Mode B tandem jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tandem-jobs/{tandemJobId}/known-partner:
    post:
      operationId: setKnownPartner
      tags: [tandem]
      summary: Set a known partner for a tandem job (Mode A)
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetKnownPartnerRequest"
      responses:
        "200":
          description: Partner linked to tandem job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Partner not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeKnownPartner
      tags: [tandem]
      summary: Remove the known partner from a tandem job
      parameters:
        - in: path
          name: tandemJobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Partner removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemJobRecord"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DispatchRideRequest:
      type: object
      properties:
        scenario:
          type: string
          description: Ride scenario key (e.g. member_dropoff, rideshare_ondemand, delivery_food)
        tier:
          type: string
          description: Service tier (e.g. tier_0_rideshare, tier_0_delivery, tier_1_passenger)
        serviceType:
          type: string
          enum: [concierge, rideshare, delivery]
          default: concierge
          description: Service category. Derived from tier if omitted.
        packageDescription:
          type: string
          nullable: true
          description: Free-text description of the package (delivery rides only)
        pickupAddress:
          type: string
        pickupLat:
          type: number
          format: float
        pickupLng:
          type: number
          format: float
        dropoffAddress:
          type: string
        dropoffLat:
          type: number
          format: float
        dropoffLng:
          type: number
          format: float
        estimatedFare:
          type: number
          format: float
        estimatedDistanceMiles:
          type: number
          format: float
        memberId:
          type: string
          nullable: true
        memberPhone:
          type: string
          nullable: true
          description: |
            Member's phone number in E.164 format. When present, Phase 3
            tandem flows SMS the member when their approval is required and
            again when the match is confirmed.
        memberName:
          type: string
          nullable: true
          description: Optional member display name used in SMS greetings.
        memberVehicleYear:
          type: integer
          nullable: true
        memberVehicleMake:
          type: string
          nullable: true
        memberVehicleModel:
          type: string
          nullable: true
        memberVehicleColor:
          type: string
          nullable: true
        targetDriverIds:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: |
            If provided, dispatches specifically to these driver IDs.
            Otherwise finds eligible online drivers automatically.
        responseDeadlineSeconds:
          type: integer
          default: 30
          description: Seconds drivers have to respond before the request expires
      required:
        - scenario
        - tier
        - pickupAddress
        - pickupLat
        - pickupLng
        - dropoffAddress
        - dropoffLat
        - dropoffLng
        - estimatedDistanceMiles

    DispatchRideResponse:
      type: object
      properties:
        rideId:
          type: string
          format: uuid
        assignmentIds:
          type: array
          items:
            type: string
            format: uuid
        driversNotified:
          type: integer
      required:
        - rideId
        - assignmentIds
        - driversNotified

    AssignmentActionResponse:
      type: object
      properties:
        success:
          type: boolean
        assignmentId:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
      required:
        - success
        - assignmentId
        - rideId

    UpdateStageRequest:
      type: object
      properties:
        stage:
          type: string
          enum: [en_route, arrived, in_progress]
      required:
        - stage

    CompleteRideRequest:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        actualDistanceMiles:
          type: number
          format: float
      required:
        - assignmentId
        - actualDistanceMiles

    RideCompletionResult:
      type: object
      properties:
        success:
          type: boolean
        rideId:
          type: string
          format: uuid
        finalFare:
          type: number
          format: float
        driverPayout:
          type: number
          format: float
      required:
        - success
        - rideId
        - finalFare
        - driverPayout

    AdminDriverRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
        licenseDocumentPath:
          type: ["string", "null"]
        insuranceDocumentPath:
          type: ["string", "null"]
        profilePhotoUrl:
          type: ["string", "null"]
        backgroundCheckPassed:
          type: boolean
        canDriveMemberVehicle:
          type: boolean
        canDoRideshare:
          type: boolean
        canDoDelivery:
          type: boolean
        totalRidesCompleted:
          type: integer
        averageRating:
          type: number
          format: float
        documentRejectionReason:
          type: ["string", "null"]
          description: Non-null when an admin has flagged documents for resubmission.
        createdAt:
          type: ["string", "null"]
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - status
        - backgroundCheckPassed
        - canDriveMemberVehicle
        - canDoRideshare
        - canDoDelivery
        - totalRidesCompleted
        - averageRating

    RejectDocumentsRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Human-readable reason shown to the driver explaining why their documents were rejected.
      required:
        - reason

    RejectDriverRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Human-readable reason emailed to the driver explaining why their application was rejected.
      required:
        - reason

    StripeAccountLink:
      type: object
      properties:
        url:
          type: string
          description: One-time Stripe account link URL to open for onboarding
        accountId:
          type: string
          description: Stripe Connect account ID (acct_...)
      required:
        - url
        - accountId

    StripeAccountStatus:
      type: object
      properties:
        accountId:
          type: ["string", "null"]
          description: Stripe Connect account ID, or null if not yet created
        onboardingComplete:
          type: boolean
          description: True when the driver has finished identity verification
        chargesEnabled:
          type: boolean
        payoutsEnabled:
          type: boolean
        hasDebitCard:
          type: boolean
          description: True when the account has at least one debit card attached
      required:
        - accountId
        - onboardingComplete
        - chargesEnabled
        - payoutsEnabled
        - hasDebitCard

    DriverAuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        action:
          type: string
          description: One of 'approve' | 'reject' | 'reject_documents' | 'clear_document_rejection'
        adminEmail:
          type: string
        resultingStatus:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - driverId
        - action
        - adminEmail
        - createdAt

    AdminActionResult:
      type: object
      properties:
        success:
          type: boolean
        driverId:
          type: string
          format: uuid
        status:
          type: string
      required:
        - success
        - driverId
        - status

    AdminRideRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scenario:
          type: string
        tier:
          type: string
        serviceType:
          type: string
          nullable: true
        packageDescription:
          type: string
          nullable: true
        status:
          type: string
        memberId:
          type: string
          nullable: true
        pickupAddress:
          type: string
        dropoffAddress:
          type: string
        estimatedFare:
          type: number
        actualFare:
          type: number
          nullable: true
        estimatedDistanceMiles:
          type: number
        createdAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - scenario
        - tier
        - status
        - pickupAddress
        - dropoffAddress
        - estimatedFare
        - estimatedDistanceMiles

    AdminCancelRideRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional reason for the cancellation (logged server-side).

    AdminCancelRideResult:
      type: object
      properties:
        success:
          type: boolean
        rideId:
          type: string
          format: uuid
        driversNotified:
          type: integer
      required:
        - success
        - rideId
        - driversNotified

    UpdateDriverServicesRequest:
      type: object
      properties:
        canDoRideshare:
          type: boolean
          nullable: true
        canDoDelivery:
          type: boolean
          nullable: true

    UpdateDriverServicesResult:
      type: object
