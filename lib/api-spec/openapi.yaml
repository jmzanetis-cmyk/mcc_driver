openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rides
    description: Ride dispatch and lifecycle operations
  - name: admin
    description: Admin operations for driver application management
  - name: ride-along
    description: Ride-Along Driver onboarding and profile management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rides/dispatch:
    post:
      operationId: dispatchRide
      tags: [rides]
      summary: Dispatch a new ride to eligible drivers
      description: |
        Creates a ride record and inserts driver_assignments rows for each
        required driver. Inserting into driver_assignments triggers Supabase
        Realtime postgres_changes events, delivering the request to online
        drivers in real time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRideRequest"
      responses:
        "201":
          description: Ride dispatched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchRideResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No eligible drivers found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/assignments/{assignmentId}/accept:
    post:
      operationId: acceptRideAssignment
      tags: [rides]
      summary: Accept a pending ride assignment
      description: |
        Atomically checks that the assignment is still pending and within the
        response deadline, then updates its status to 'accepted'. Returns an
        error if the deadline has passed or another driver already accepted.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentActionResponse"
        "400":
          description: Deadline passed or assignment no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/assignments/{assignmentId}/decline:
    post:
      operationId: declineRideAssignment
      tags: [rides]
      summary: Decline a pending ride assignment
      description: |
        Marks the assignment as 'rejected'. The dispatch system can then
        offer the ride to the next available driver.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentActionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/assignments/{assignmentId}/stage:
    patch:
      operationId: updateAssignmentStage
      tags: [rides]
      summary: Update the active stage of a ride assignment
      description: |
        Records stage transitions (en_route → arrived → in_progress) for an
        active assignment. Used by the driver during a live ride.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStageRequest"
      responses:
        "200":
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentActionResponse"
        "400":
          description: Invalid stage transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rides/{rideId}/complete:
    post:
      operationId: completeRide
      tags: [rides]
      summary: Complete a ride and trigger payout calculation
      description: |
        Marks the ride as completed, recalculates fare based on actual distance,
        updates the driver assignment, and creates a payout record. Requires
        the assignment to be in 'in_progress' status.
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRideRequest"
      responses:
        "200":
          description: Ride completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideCompletionResult"
        "400":
          description: Ride not in completable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ride or assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ride-along-drivers:
    post:
      operationId: createRideAlongDriver
      tags: [ride-along]
      summary: Create a Ride-Along Driver application
      description: |
        Creates a new Ride-Along Driver profile for the authenticated user.
        Returns 409 if the user already has a profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRideAlongDriverRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideAlongDriverRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Profile already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ride-along-drivers/me:
    get:
      operationId: getRideAlongDriverMe
      tags: [ride-along]
      summary: Get the authenticated user's Ride-Along Driver profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideAlongDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No profile found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ride-along-drivers/{id}:
    patch:
      operationId: updateRideAlongDriver
      tags: [ride-along]
      summary: Update a Ride-Along Driver profile
      description: Used by the driver to update documents or resubmit after rejection.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRideAlongDriverRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideAlongDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not your profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ride-along-drivers:
    get:
      operationId: listAdminRideAlongDrivers
      tags: [admin]
      summary: List Ride-Along Driver applications for admin review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: pending_approval
          description: Filter by status
      responses:
        "200":
          description: List of Ride-Along Driver records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRideAlongDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ride-along-drivers/{id}/approve:
    post:
      operationId: approveRideAlongDriver
      tags: [admin]
      summary: Approve a Ride-Along Driver application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ride-along-drivers/{id}/reject:
    post:
      operationId: rejectRideAlongDriver
      tags: [admin]
      summary: Reject a Ride-Along Driver application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers:
    get:
      operationId: listAdminDrivers
      tags: [admin]
      summary: List drivers filtered by status
      description: |
        Returns driver application records for admin review.
        Requires admin authentication (Bearer token + ADMIN_EMAILS check).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: pending_approval
          description: Filter by driver status
      responses:
        "200":
          description: Driver list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDriverRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers/{driverId}/approve:
    post:
      operationId: approveDriver
      tags: [admin]
      summary: Approve a driver application
      description: Sets the driver's status to active.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Driver approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/drivers/{driverId}/reject:
    post:
      operationId: rejectDriver
      tags: [admin]
      summary: Reject a driver application
      description: Sets the driver's status to inactive.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Driver rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DispatchRideRequest:
      type: object
      properties:
        scenario:
          type: string
          description: Ride scenario key (e.g. member_dropoff, paired_vehicle_delivery)
        tier:
          type: string
          description: Service tier (e.g. tier_1_passenger)
        pickupAddress:
          type: string
        pickupLat:
          type: number
          format: float
        pickupLng:
          type: number
          format: float
        dropoffAddress:
          type: string
        dropoffLat:
          type: number
          format: float
        dropoffLng:
          type: number
          format: float
        estimatedFare:
          type: number
          format: float
        estimatedDistanceMiles:
          type: number
          format: float
        memberId:
          type: string
          nullable: true
        memberVehicleYear:
          type: integer
          nullable: true
        memberVehicleMake:
          type: string
          nullable: true
        memberVehicleModel:
          type: string
          nullable: true
        memberVehicleColor:
          type: string
          nullable: true
        targetDriverIds:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: |
            If provided, dispatches specifically to these driver IDs.
            Otherwise finds eligible online drivers automatically.
        responseDeadlineSeconds:
          type: integer
          default: 30
          description: Seconds drivers have to respond before the request expires
      required:
        - scenario
        - tier
        - pickupAddress
        - pickupLat
        - pickupLng
        - dropoffAddress
        - dropoffLat
        - dropoffLng
        - estimatedFare
        - estimatedDistanceMiles

    DispatchRideResponse:
      type: object
      properties:
        rideId:
          type: string
          format: uuid
        assignmentIds:
          type: array
          items:
            type: string
            format: uuid
        driversNotified:
          type: integer
      required:
        - rideId
        - assignmentIds
        - driversNotified

    AssignmentActionResponse:
      type: object
      properties:
        success:
          type: boolean
        assignmentId:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
      required:
        - success
        - assignmentId
        - rideId

    UpdateStageRequest:
      type: object
      properties:
        stage:
          type: string
          enum: [en_route, arrived, in_progress]
      required:
        - stage

    CompleteRideRequest:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        actualDistanceMiles:
          type: number
          format: float
      required:
        - assignmentId
        - actualDistanceMiles

    RideCompletionResult:
      type: object
      properties:
        success:
          type: boolean
        rideId:
          type: string
          format: uuid
        finalFare:
          type: number
          format: float
        driverPayout:
          type: number
          format: float
      required:
        - success
        - rideId
        - finalFare
        - driverPayout

    AdminDriverRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
        licenseDocumentPath:
          type: ["string", "null"]
        insuranceDocumentPath:
          type: ["string", "null"]
        profilePhotoUrl:
          type: ["string", "null"]
        backgroundCheckPassed:
          type: boolean
        canDriveMemberVehicle:
          type: boolean
        totalRidesCompleted:
          type: integer
        averageRating:
          type: number
          format: float
        createdAt:
          type: ["string", "null"]
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - status
        - backgroundCheckPassed
        - canDriveMemberVehicle
        - totalRidesCompleted
        - averageRating

    AdminActionResult:
      type: object
      properties:
        success:
          type: boolean
        driverId:
          type: string
          format: uuid
        status:
          type: string
      required:
        - success
        - driverId
        - status

    CreateRideAlongDriverRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        zipCode:
          type: string
          nullable: true
        maxDistanceMiles:
          type: integer
          default: 20
        licenseNumber:
          type: string
          nullable: true
        licenseState:
          type: string
          nullable: true
        licenseExpiry:
          type: string
          nullable: true
        licenseDocumentPath:
          type: string
          nullable: true
        insuranceDocumentPath:
          type: string
          nullable: true
        insuranceExpiry:
          type: string
          nullable: true
        profilePhotoPath:
          type: string
          nullable: true
        agreementSigned:
          type: boolean
          nullable: true
      required:
        - firstName
        - lastName
        - email
        - phone

    UpdateRideAlongDriverRequest:
      type: object
      properties:
        zipCode:
          type: string
          nullable: true
        maxDistanceMiles:
          type: integer
        licenseNumber:
          type: string
          nullable: true
        licenseState:
          type: string
          nullable: true
        licenseExpiry:
          type: string
          nullable: true
        licenseDocumentPath:
          type: string
          nullable: true
        insuranceDocumentPath:
          type: string
          nullable: true
        insuranceExpiry:
          type: string
          nullable: true
        profilePhotoPath:
          type: string
          nullable: true
        agreementSigned:
          type: boolean
          nullable: true

    RideAlongDriverRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        zipCode:
          type: ["string", "null"]
        maxDistanceMiles:
          type: integer
        licenseNumber:
          type: ["string", "null"]
        licenseState:
          type: ["string", "null"]
        licenseExpiry:
          type: ["string", "null"]
        licenseDocumentPath:
          type: ["string", "null"]
        insuranceDocumentPath:
          type: ["string", "null"]
        insuranceExpiry:
          type: ["string", "null"]
        backgroundCheckStatus:
          type: string
          description: "pending | passed | failed"
        verified:
          type: boolean
        profilePhotoPath:
          type: ["string", "null"]
        agreementSignedAt:
          type: ["string", "null"]
        rating:
          type: number
          format: float
        totalJobs:
          type: integer
        status:
          type: string
        createdAt:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
      required:
        - id
        - userId
        - firstName
        - lastName
        - email
        - phone
        - maxDistanceMiles
        - backgroundCheckStatus
        - verified
        - rating
        - totalJobs
        - status

    AdminRideAlongDriverRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        zipCode:
          type: ["string", "null"]
        maxDistanceMiles:
          type: integer
        licenseNumber:
          type: ["string", "null"]
        licenseState:
          type: ["string", "null"]
        licenseExpiry:
          type: ["string", "null"]
        licenseDocumentPath:
          type: ["string", "null"]
        insuranceDocumentPath:
          type: ["string", "null"]
        insuranceExpiry:
          type: ["string", "null"]
        backgroundCheckStatus:
          type: string
        verified:
          type: boolean
        profilePhotoPath:
          type: ["string", "null"]
        agreementSignedAt:
          type: ["string", "null"]
        rating:
          type: number
          format: float
        totalJobs:
          type: integer
        status:
          type: string
        createdAt:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
      required:
        - id
        - userId
        - firstName
        - lastName
        - email
        - phone
        - maxDistanceMiles
        - backgroundCheckStatus
        - verified
        - rating
        - totalJobs
        - status
